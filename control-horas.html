<title>Control de Horas</title>
<style>
  :root {
    --bg: #f3f1ec;
    --surface: #ffffff;
    --surface-2: #faf8f3;
    --ink: #1f2420;
    --ink-soft: #5c635c;
    --line: #e2ddd2;
    --accent: #2f6d4f;
    --accent-soft: #e3efe7;
    --accent-ink: #1d4733;
    --warn: #b7791f;
    --danger: #a93226;
    --shadow: 0 1px 2px rgba(31,36,32,.05), 0 8px 24px rgba(31,36,32,.06);
    --radius: 14px;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --display: "Fraunces", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181530;
      --bg: #141714;
      --surface: #1d211d;
      --surface-2: #191d19;
      --ink: #eef0ea;
      --ink-soft: #a3ab a1;
      --ink-soft: #a0a89e;
      --line: #2d332d;
      --accent: #4fa87a;
      --accent-soft: #1f2e26;
      --accent-ink: #9fd9bb;
      --warn: #d8a654;
      --danger: #e07063;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141714;
    --surface: #1d211d;
    --surface-2: #191d19;
    --ink: #eef0ea;
    --ink-soft: #a0a89e;
    --line: #2d332d;
    --accent: #4fa87a;
    --accent-soft: #1f2e26;
    --accent-ink: #9fd9bb;
    --warn: #d8a654;
    --danger: #e07063;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
    padding-block: 28px 64px;
  }

  header.top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 26px;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 60px;
    height: 60px;
    object-fit: contain;
    flex: none;
    border-radius: 8px;
  }
  @media (max-width: 480px) { .logo { width: 48px; height: 48px; } }
  .brand h1 {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(1.9rem, 4vw, 2.7rem);
    letter-spacing: -.02em;
    margin: 0;
    text-wrap: balance;
  }
  .brand p {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: .95rem;
  }
  .theme-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: .85rem;
    cursor: pointer;
    font-family: var(--sans);
    transition: border-color .15s, color .15s;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Stat tiles */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
  }
  .tile .label {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .tile .value {
    font-family: var(--display);
    font-size: 2.1rem;
    font-weight: 600;
    letter-spacing: -.02em;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .tile .value small { font-size: .95rem; color: var(--ink-soft); font-family: var(--sans); font-weight: 500; }

  .grid {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 22px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel h2 {
    font-family: var(--display);
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    letter-spacing: -.01em;
  }
  .panel .body { padding: 18px; }

  label.field { display: block; margin-bottom: 14px; }
  label.field span {
    display: block;
    font-size: .78rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 5px;
    letter-spacing: .02em;
  }
  input, select {
    width: 100%;
    font-family: var(--sans);
    font-size: .95rem;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--ink);
  }
  input:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  input::placeholder { color: var(--ink-soft); opacity: .7; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: .95rem;
    font-weight: 600;
    font-family: var(--sans);
    cursor: pointer;
    transition: filter .15s, transform .05s;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--line);
    width: auto;
    padding: 7px 12px;
    font-size: .82rem;
  }
  .btn.ghost:hover { border-color: var(--accent); background: var(--accent-soft); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* People chips in form */
  .hint { font-size: .78rem; color: var(--ink-soft); margin: -6px 0 14px; }

  /* Summary bars */
  .person-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .person-row:last-child { border-bottom: none; }
  .person-name {
    font-weight: 600;
    min-width: 110px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .bar-track {
    flex: 1;
    height: 10px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
  .person-hours {
    font-family: var(--mono);
    font-size: .9rem;
    font-weight: 500;
    min-width: 64px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .toolbar select { width: auto; min-width: 150px; padding: 7px 10px; font-size: .85rem; }
  .toolbar .spacer { flex: 1; }

  /* Table */
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  thead th {
    text-align: left;
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td {
    padding: 11px 18px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  td.hours { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: .82rem;
    font-weight: 500;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-ink);
  }
  .note-cell { color: var(--ink-soft); max-width: 220px; }
  .del {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 1rem;
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1;
  }
  .del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--ink-soft);
  }
  .empty .big { font-size: 2rem; margin-bottom: 8px; }

  footer.foot {
    margin-top: 32px;
    text-align: center;
    color: var(--ink-soft);
    font-size: .8rem;
  }
  .tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent-ink);
    font-size: .72rem;
    font-weight: 600;
    font-family: var(--mono);
  }
  /* Gestor de personas */
  .pm-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .pm-row:last-child { border-bottom: none; }
  .pm-row .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .pm-row .pm-name {
    flex: 1;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    font-family: var(--sans);
    font-size: .92rem;
    font-weight: 500;
    padding: 6px 8px;
    border-radius: 8px;
    min-width: 0;
  }
  .pm-row .pm-name:hover { border-color: var(--line); }
  .pm-row .pm-name:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--surface-2); }
  .pm-count { font-family: var(--mono); font-size: .76rem; color: var(--ink-soft); white-space: nowrap; }
  .pm-del {
    background: none; border: none; color: var(--ink-soft);
    cursor: pointer; font-size: .95rem; padding: 5px 7px; border-radius: 6px; line-height: 1;
  }
  .pm-del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .pm-empty { color: var(--ink-soft); font-size: .85rem; margin: 2px 0 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      <div class="brand-text">
        <h1>Control de Horas</h1>
        <p>Registro y seguimiento de horas trabajadas por persona</p>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button">◐ Tema</button>
  </header>

  <section class="stats" id="stats"></section>

  <div class="grid">
    <!-- Formulario -->
    <aside class="panel">
      <h2>Registrar horas</h2>
      <div class="body">
        <label class="field">
          <span>Persona</span>
          <input list="peopleList" id="person" placeholder="Nombre de la persona" autocomplete="off">
          <datalist id="peopleList"></datalist>
        </label>
        <p class="hint">Escribe un nombre nuevo o elige uno existente.</p>
        <div class="row2">
          <label class="field">
            <span>Fecha</span>
            <input type="date" id="date">
          </label>
          <label class="field">
            <span>Horas</span>
            <input type="number" id="hours" min="0" max="24" step="0.25" placeholder="8">
          </label>
        </div>
        <label class="field">
          <span>Proyecto / tarea <small style="font-weight:400">(opcional)</small></span>
          <input id="note" placeholder="Ej. Soporte, reunión, desarrollo…" autocomplete="off">
        </label>
        <button class="btn" id="addBtn" type="button">+ Agregar registro</button>
      </div>

      <h2 style="border-top:1px solid var(--line)">Personas</h2>
      <div class="body">
        <div class="row2" style="grid-template-columns:1fr auto; gap:8px; align-items:end;">
          <label class="field" style="margin:0">
            <span>Nueva persona</span>
            <input id="newPerson" placeholder="Nombre" autocomplete="off">
          </label>
          <button class="btn" id="addPersonBtn" type="button" style="width:auto;padding:10px 14px;margin-bottom:0">+ Crear</button>
        </div>
        <div id="peopleManager" style="margin-top:14px;"></div>
      </div>
    </aside>

    <!-- Resumen + tabla -->
    <main style="display:flex; flex-direction:column; gap:22px;">
      <section class="panel">
        <h2>Resumen por persona</h2>
        <div class="body" id="summary"></div>
      </section>

      <section class="panel">
        <div class="toolbar">
          <select id="filterPerson"><option value="">Todas las personas</option></select>
          <select id="filterRange">
            <option value="all">Todo el tiempo</option>
            <option value="week">Esta semana</option>
            <option value="month">Este mes</option>
          </select>
          <div class="spacer"></div>
          <button class="btn ghost" id="exportBtn" type="button">⬇ Exportar CSV</button>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Fecha</th><th>Persona</th><th>Proyecto / tarea</th>
                <th style="text-align:right">Horas</th><th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="emptyState"></div>
      </section>
    </main>
  </div>

  <footer class="foot">
    Los datos se guardan en este navegador <span class="tag">localStorage</span> · Interarma
  </footer>
</div>

<script>
(function () {
  "use strict";
  var KEY = "control-horas-v1";
  var COLORS = ["#2f6d4f","#b7791f","#3d6ea5","#a93226","#7a4fa8","#2f8d8d","#c0632b","#5a7a2f"];

  var state = { entries: [], people: [] };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) state = JSON.parse(raw);
    if (!state.entries) state.entries = [];
    if (!state.people) state.people = [];
  } catch (e) { state = { entries: [], people: [] }; }
  // Migración: asegurar que toda persona con registros esté en la lista
  state.entries.forEach(function(e){ if (state.people.indexOf(e.person) < 0) state.people.push(e.person); });

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  // Seed de ejemplo la primera vez
  if (state.entries.length === 0 && !localStorage.getItem(KEY + "-seen")) {
    var t = new Date();
    function d(off){ var x=new Date(t); x.setDate(x.getDate()-off); return x.toISOString().slice(0,10); }
    state.entries = [
      { id: uid(), person: "Ana Torres", date: d(0), hours: 8, note: "Desarrollo" },
      { id: uid(), person: "Ana Torres", date: d(1), hours: 6.5, note: "Reuniones" },
      { id: uid(), person: "Luis Ramírez", date: d(0), hours: 7, note: "Análisis de incidentes" },
      { id: uid(), person: "Luis Ramírez", date: d(2), hours: 8, note: "Monitoreo" },
      { id: uid(), person: "Carmen Díaz", date: d(1), hours: 4, note: "Soporte" }
    ];
    try { localStorage.setItem(KEY + "-seen", "1"); } catch(e) {}
    save();
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function fmtH(n) { return (Math.round(n * 100) / 100).toString(); }
  function colorFor(name) {
    var people = allPeople();
    var i = people.indexOf(name);
    return COLORS[(i < 0 ? 0 : i) % COLORS.length];
  }
  function allPeople() {
    var set = state.people.slice();
    state.entries.forEach(function(e){ if (set.indexOf(e.person) < 0) set.push(e.person); });
    set.sort(function(a,b){ return a.localeCompare(b); });
    return set;
  }
  function hoursFor(name) {
    return state.entries.reduce(function(s,e){ return e.person === name ? s + e.hours : s; }, 0);
  }
  function countFor(name) {
    return state.entries.filter(function(e){ return e.person === name; }).length;
  }
  function fmtDate(iso) {
    var p = iso.split("-");
    return p[2] + "/" + p[1] + "/" + p[0].slice(2);
  }

  // --- Filtros ---
  function inRange(iso, range) {
    if (range === "all") return true;
    var now = new Date(); now.setHours(0,0,0,0);
    var dt = new Date(iso + "T00:00:00");
    if (range === "week") {
      var day = (now.getDay() + 6) % 7; // lunes = 0
      var start = new Date(now); start.setDate(now.getDate() - day);
      return dt >= start;
    }
    if (range === "month") {
      return dt.getFullYear() === now.getFullYear() && dt.getMonth() === now.getMonth();
    }
    return true;
  }
  function filtered() {
    var fp = $("filterPerson").value, fr = $("filterRange").value;
    return state.entries.filter(function(e){
      return (!fp || e.person === fp) && inRange(e.date, fr);
    }).sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }

  // --- Render ---
  function render() {
    renderDatalist();
    renderFilterPeople();
    renderPeopleManager();
    renderStats();
    renderSummary();
    renderTable();
  }

  function renderPeopleManager() {
    var people = allPeople();
    var box = $("peopleManager");
    if (people.length === 0) {
      box.innerHTML = "<p class=\"pm-empty\">Aún no hay personas. Crea una arriba.</p>";
      return;
    }
    box.innerHTML = people.map(function(n){
      var c = colorFor(n);
      return "<div class=\"pm-row\">" +
        "<span class=\"dot\" style=\"background:" + c + "\"></span>" +
        "<input class=\"pm-name\" value=\"" + esc(n) + "\" data-orig=\"" + esc(n) + "\" aria-label=\"Nombre\">" +
        "<span class=\"pm-count\">" + fmtH(hoursFor(n)) + " h · " + countFor(n) + "</span>" +
        "<button class=\"pm-del\" data-name=\"" + esc(n) + "\" title=\"Eliminar persona\">🗑</button>" +
        "</div>";
    }).join("");
  }

  function addPerson() {
    var name = $("newPerson").value.trim();
    if (!name) { flash($("newPerson")); return; }
    if (allPeople().some(function(p){ return p.toLowerCase() === name.toLowerCase(); })) {
      flash($("newPerson")); return;
    }
    state.people.push(name);
    save();
    $("newPerson").value = "";
    render();
  }

  function renamePerson(oldName, newName) {
    newName = newName.trim();
    if (!newName || newName === oldName) { render(); return; }
    if (allPeople().some(function(p){ return p !== oldName && p.toLowerCase() === newName.toLowerCase(); })) {
      render(); return; // nombre duplicado: se revierte
    }
    state.people = state.people.map(function(p){ return p === oldName ? newName : p; });
    if (state.people.indexOf(newName) < 0) state.people.push(newName);
    state.entries.forEach(function(e){ if (e.person === oldName) e.person = newName; });
    save();
    render();
  }

  function deletePerson(name) {
    var n = countFor(name);
    var msg = n > 0
      ? "Eliminar a \"" + name + "\" borrará también sus " + n + " registro(s). ¿Continuar?"
      : "¿Eliminar a \"" + name + "\"?";
    if (!window.confirm(msg)) return;
    state.people = state.people.filter(function(p){ return p !== name; });
    state.entries = state.entries.filter(function(e){ return e.person !== name; });
    save();
    render();
  }

  function renderDatalist() {
    $("peopleList").innerHTML = allPeople().map(function(p){
      return "<option value=\"" + esc(p) + "\">"; }).join("");
  }
  function renderFilterPeople() {
    var sel = $("filterPerson"); var cur = sel.value;
    sel.innerHTML = "<option value=\"\">Todas las personas</option>" +
      allPeople().map(function(p){ return "<option value=\"" + esc(p) + "\">" + esc(p) + "</option>"; }).join("");
    sel.value = cur;
  }

  function renderStats() {
    var list = filtered();
    var total = list.reduce(function(s,e){ return s + e.hours; }, 0);
    var people = {};
    list.forEach(function(e){ people[e.person] = true; });
    var np = Object.keys(people).length;
    var avg = np ? total / np : 0;
    var days = {}; list.forEach(function(e){ days[e.person + e.date] = true; });
    var tiles = [
      { label: "Horas totales", value: fmtH(total), sub: "h" },
      { label: "Personas", value: np, sub: "" },
      { label: "Promedio / persona", value: fmtH(avg), sub: "h" },
      { label: "Registros", value: list.length, sub: "" }
    ];
    $("stats").innerHTML = tiles.map(function(t){
      return "<div class=\"tile\"><div class=\"label\">" + t.label + "</div>" +
        "<div class=\"value\">" + t.value + (t.sub ? " <small>" + t.sub + "</small>" : "") + "</div></div>";
    }).join("");
  }

  function renderSummary() {
    var list = filtered();
    var totals = {};
    list.forEach(function(e){ totals[e.person] = (totals[e.person] || 0) + e.hours; });
    var names = Object.keys(totals).sort(function(a,b){ return totals[b] - totals[a]; });
    if (names.length === 0) {
      $("summary").innerHTML = "<p style=\"color:var(--ink-soft);margin:0\">Sin datos para mostrar.</p>";
      return;
    }
    var max = Math.max.apply(null, names.map(function(n){ return totals[n]; }));
    $("summary").innerHTML = names.map(function(n){
      var pct = max ? (totals[n] / max * 100) : 0;
      var c = colorFor(n);
      return "<div class=\"person-row\">" +
        "<div class=\"person-name\"><span class=\"dot\" style=\"background:" + c + "\"></span>" + esc(n) + "</div>" +
        "<div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:" + pct + "%;background:" + c + "\"></div></div>" +
        "<div class=\"person-hours\">" + fmtH(totals[n]) + " h</div>" +
        "</div>";
    }).join("");
  }

  function renderTable() {
    var list = filtered();
    var tb = $("rows");
    if (list.length === 0) {
      tb.innerHTML = "";
      $("emptyState").innerHTML = "<div class=\"empty\"><div class=\"big\">🕗</div>" +
        "<div>No hay registros con estos filtros.</div></div>";
      return;
    }
    $("emptyState").innerHTML = "";
    tb.innerHTML = list.map(function(e){
      return "<tr>" +
        "<td style=\"white-space:nowrap\">" + fmtDate(e.date) + "</td>" +
        "<td><span class=\"pill\"><span class=\"dot\" style=\"background:" + colorFor(e.person) + "\"></span>" + esc(e.person) + "</span></td>" +
        "<td class=\"note-cell\">" + (e.note ? esc(e.note) : "—") + "</td>" +
        "<td class=\"hours\" style=\"text-align:right\">" + fmtH(e.hours) + "</td>" +
        "<td style=\"text-align:right\"><button class=\"del\" data-id=\"" + e.id + "\" title=\"Eliminar\">✕</button></td>" +
        "</tr>";
    }).join("");
  }

  // --- Acciones ---
  function addEntry() {
    var person = $("person").value.trim();
    var date = $("date").value;
    var hours = parseFloat($("hours").value);
    var note = $("note").value.trim();
    if (!person) { $("person").focus(); flash($("person")); return; }
    if (!date) { $("date").focus(); flash($("date")); return; }
    if (!(hours > 0)) { $("hours").focus(); flash($("hours")); return; }
    if (state.people.indexOf(person) < 0) state.people.push(person);
    state.entries.push({ id: uid(), person: person, date: date, hours: hours, note: note });
    save();
    $("hours").value = ""; $("note").value = "";
    $("person").focus();
    render();
  }
  function flash(el) {
    el.style.outline = "2px solid var(--danger)";
    setTimeout(function(){ el.style.outline = ""; }, 900);
  }

  function exportCSV() {
    var list = filtered();
    if (list.length === 0) return;
    var rows = [["Fecha","Persona","Proyecto/Tarea","Horas"]];
    list.forEach(function(e){ rows.push([e.date, e.person, e.note || "", fmtH(e.hours)]); });
    var csv = rows.map(function(r){
      return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(",");
    }).join("\n");
    showCSV(csv);
  }

  function showCSV(csv) {
    var ov = document.createElement("div");
    ov.setAttribute("style", "position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);" +
      "display:flex;align-items:center;justify-content:center;padding:20px;");
    var card = document.createElement("div");
    card.setAttribute("style", "background:var(--surface);border:1px solid var(--line);border-radius:14px;" +
      "box-shadow:var(--shadow);max-width:640px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;");
    card.innerHTML =
      "<div style=\"padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px\">" +
        "<strong style=\"font-family:var(--display)\">Exportar CSV</strong>" +
        "<span style=\"font-size:.8rem;color:var(--ink-soft)\">Selecciona y copia el texto</span></div>" +
      "<textarea readonly style=\"flex:1;margin:0;border:none;resize:none;padding:16px 18px;" +
        "font-family:var(--mono);font-size:.82rem;background:var(--surface-2);color:var(--ink);min-height:220px;outline:none\"></textarea>" +
      "<div style=\"padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end\">" +
        "<button class=\"btn ghost\" data-act=\"copy\">Copiar</button>" +
        "<button class=\"btn ghost\" data-act=\"close\">Cerrar</button></div>";
    var ta = card.querySelector("textarea"); ta.value = csv;
    ov.appendChild(card); document.body.appendChild(ov);
    ta.focus(); ta.select();
    function close(){ ov.remove(); }
    ov.addEventListener("click", function(ev){ if (ev.target === ov) close(); });
    card.addEventListener("click", function(ev){
      var a = ev.target.getAttribute("data-act");
      if (a === "close") close();
      if (a === "copy") {
        ta.select();
        try {
          if (navigator.clipboard) navigator.clipboard.writeText(csv);
          else document.execCommand("copy");
          ev.target.textContent = "¡Copiado!";
          setTimeout(function(){ ev.target.textContent = "Copiar"; }, 1500);
        } catch (e) {}
      }
    });
  }

  // Tema
  function applyTheme(mode) {
    if (mode) document.documentElement.setAttribute("data-theme", mode);
    try { localStorage.setItem(KEY + "-theme", mode); } catch(e) {}
  }
  (function initTheme(){
    try {
      var saved = localStorage.getItem(KEY + "-theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    } catch(e) {}
  })();

  // Eventos
  $("addBtn").addEventListener("click", addEntry);
  ["person","hours","note","date"].forEach(function(id){
    $(id).addEventListener("keydown", function(ev){ if (ev.key === "Enter") addEntry(); });
  });
  $("rows").addEventListener("click", function(ev){
    var b = ev.target.closest(".del"); if (!b) return;
    var id = b.getAttribute("data-id");
    state.entries = state.entries.filter(function(e){ return e.id !== id; });
    save(); render();
  });
  $("addPersonBtn").addEventListener("click", addPerson);
  $("newPerson").addEventListener("keydown", function(ev){ if (ev.key === "Enter") addPerson(); });
  $("peopleManager").addEventListener("click", function(ev){
    var b = ev.target.closest(".pm-del"); if (!b) return;
    deletePerson(b.getAttribute("data-name"));
  });
  $("peopleManager").addEventListener("keydown", function(ev){
    if (ev.key === "Enter" && ev.target.classList.contains("pm-name")) { ev.preventDefault(); ev.target.blur(); }
  });
  $("peopleManager").addEventListener("blur", function(ev){
    var inp = ev.target; if (!inp.classList || !inp.classList.contains("pm-name")) return;
    renamePerson(inp.getAttribute("data-orig"), inp.value);
  }, true);
  $("filterPerson").addEventListener("change", render);
  $("filterRange").addEventListener("change", render);
  $("exportBtn").addEventListener("click", exportCSV);
  $("themeBtn").addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var isDark = cur === "dark" || (!cur && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    applyTheme(isDark ? "light" : "dark");
  });

  // Fecha por defecto = hoy
  $("date").value = new Date().toISOString().slice(0, 10);

  render();
})();
</script>
